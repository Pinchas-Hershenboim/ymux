# Windows CI — the checks that used to be run by hand on every merge.
#
# Deliberately NOT a build: this job proves the tree is healthy, in the
# ~8 minutes you are willing to wait on a PR. Producing installers is
# build-windows.yml's job, on demand.
#
# Ordering note that is easy to get wrong: `build:linux-cli` MUST run
# before anything that touches cargo. It is what stages
# src-tauri/resources/ymux-cli.exe, which is gitignored — and Tauri's
# build script hard-fails with "resource path doesn't exist" without it.
# A fresh checkout is exactly that case (see FOLLOWUPS P3).
name: ci-windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Belt-and-braces so the value reaching Windows PowerShell 5.1 is
      # explicit rather than whatever the runner image happens to set.
      # The actual fix for the Get-FileHash failure is `shell: cmd` on the
      # steps that shell out to it — see the Stage CLI resources step.
      PSModulePath: C:\Windows\system32\WindowsPowerShell\v1.0\Modules;C:\Program Files\WindowsPowerShell\Modules
      # `cargo test` runs the dev profile, where incremental is on by default.
      # rust-cache deletes target/debug/incremental before saving, so CI was
      # paying to write incremental state that is thrown away every run.
      CARGO_INCREMENTAL: "0"
      # PDB generation is disproportionately slow on Windows and nothing here
      # reads them. Backtraces keep symbol names, they just lose line numbers.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      # Fails in seconds on a syntax error that would otherwise surface
      # fifteen minutes into a release build. `shell: powershell` is Windows
      # PowerShell 5.1 on purpose: it is what actually runs these scripts, and
      # it reads BOM-less UTF-8 as ANSI -- so a non-ASCII character inside a
      # string literal (an em-dash decodes to a smart quote, which the
      # tokenizer treats as a string delimiter) breaks parsing here and
      # nowhere else.
      - name: Parse-check the build scripts
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem app/scripts/*.ps1 | ForEach-Object {
            $e = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            if ($e.Count) {
              $bad++
              Write-Host ("FAIL {0}: line {1}: {2}" -f $_.Name, $e[0].Extent.StartLineNumber, $e[0].Message)
            } else {
              Write-Host ("ok   {0}" -f $_.Name)
            }
          }
          exit $bad

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # Keyed on the lockfile: dependency builds dominate the runtime and
      # only change when Cargo.lock does. Explicit shared-key so this job's
      # dev-profile cache stays separate from the release-profile one that
      # warm-rust-cache.yml maintains for build-windows.yml.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          shared-key: windows-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/src-tauri/server/go.mod
          cache-dependency-path: app/src-tauri/server/go.sum

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      # Stages ymux-cli.exe + ymux-linux-x64 + remote-manifest.json.
      # The musl cross-build links with rust-lld (see src-tauri/.cargo/
      # config.toml), so no external linker is needed on a Windows runner.
      # Fails in seconds if the cmdlet is unreachable, rather than four
      # minutes into a musl cross-build. Must use the same shell as the
      # step below or it does not prove anything.
      - name: Check Windows PowerShell can autoload its own cmdlets
        shell: cmd
        run: powershell -NoProfile -Command "if (-not (Get-Command Get-FileHash -EA SilentlyContinue)) { Write-Error 'Get-FileHash unavailable — build-linux-cli.ps1 will fail'; exit 1 }; 'Get-FileHash OK'"

      # `shell: cmd` is load-bearing. The default shell for `run:` on
      # Windows runners is pwsh (PowerShell 7), and pwsh rewrites
      # PSModulePath for its children to its own module dirs. npm inherits
      # that and passes it to the Windows PowerShell 5.1 that
      # build:linux-cli spawns, which then cannot autoload
      # Microsoft.PowerShell.Utility — so Get-FileHash is undefined and the
      # script dies at its first hash, AFTER the cross-build has already
      # succeeded. Measured: identical PSModulePath via cmd works, via pwsh
      # does not. Keeping pwsh out of the chain is the fix.
      - name: Stage CLI resources
        working-directory: app
        shell: cmd
        run: npm run build:linux-cli

      - name: cargo test
        working-directory: app/src-tauri
        run: cargo test --workspace

      # `npm ci` installs the pinned typescript from app/package.json
      # devDependencies. There used to be an `npm i --no-save typescript@5`
      # here from when it wasn't a project dependency -- that also meant the
      # type-check ran against a different minor than developers use locally.
      - name: Type-check
        working-directory: app
        run: npx tsc --noEmit -p tsconfig.json

      # esbuild strips types without checking them, so this is a bundling
      # check, not a type check — it catches bad imports and dead assets.
      - name: Frontend build
        working-directory: app
        run: npm run build:frontend

      - name: go test
        working-directory: app/src-tauri/server
        run: go test ./...

      # The staging script rewrites remote-manifest.json with a fresh
      # built_at every run. Per CLAUDE.md #12 that churn is cosmetic — but
      # a changed sha256 means the CLI binary actually moved, which is
      # worth seeing in the log rather than discovering at release time.
      - name: Report staged-resource drift
        if: always()
        working-directory: app
        shell: pwsh
        run: |
          $diff = git diff --unified=0 -- src-tauri/resources/remote-manifest.json
          if ($diff -match '"sha256"') {
            Write-Host "::notice::remote-manifest sha256 changed — the staged CLI binary differs from the committed one"
            Write-Host $diff
          } else {
            Write-Host "remote-manifest: timestamp-only churn (expected)"
          }
