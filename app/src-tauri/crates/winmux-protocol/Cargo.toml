[package]
name = "winmux-protocol"
version = "0.0.0"
edition = "2021"
publish = false
description = "Phase 67.A.1: wire protocol shared between the winmux server (Rust) and future clients (mobile / web). Pure types — no IO, no tokio."

[dependencies]
# Reuse the canonical data model (Workspace / LayoutNode / …) instead of
# redefining it, so the mobile client sees exactly the panes the desktop
# sees and the model stays defined in one place.
winmux-types = { path = "../winmux-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "8", optional = true }

[features]
# Opt-in TS binding export for a future web client. The Rust server links
# this crate WITHOUT `ts` (no need); enable it when a web client lands.
ts = ["dep:ts-rs"]
